stages:
  - validate
  - test 

variables:
  TF_VERSION: "1.5.0"
  TF_ROOT: "${CI_PROJECT_DIR}/terraform"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

image: ubuntu:latest

before_script:
  # Install required tools
  - apt-get update
  - apt-get install -y curl unzip bash git make ansible

  # Install Terraform if not already installed
  - |
    if [ ! -f /usr/local/bin/terraform ]; then
      curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/tf.zip
      unzip -o /tmp/tf.zip -d /usr/local/bin
      rm -f /tmp/tf.zip
    fi
  - terraform version

# ============================================================================
# VALIDATE STAGE: Format and validate all code
# ============================================================================

tf-fmt:
  stage: validate
  script:
    - make tf-fmt
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^feature\//

tf-validate:
  stage: validate
  script:
    - make tf-validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^feature\//

