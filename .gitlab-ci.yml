stages:
  - validate
  - test 

variables:
  TF_VERSION: "1.5.0"
  TF_ROOT: "${CI_PROJECT_DIR}/terraform"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

image: ubuntu:latest

before_script:
  # Install required tools
  - apt-get update
  - apt-get install -y curl unzip bash git make ansible

# ============================================================================
# VALIDATE STAGE: Format and validate all code
# ============================================================================

tf-fmt:
  stage: validate
  script:
    - make tf-fmt
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^feature\//

tf-validate:
  stage: test
  script:
    - make tf-validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^feature\//

