stages:
  - validate
  - test 

variables:
  TF_VERSION: "1.5.0"
  TF_ROOT: "${CI_PROJECT_DIR}/terraform"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

image: ubuntu:latest

before_script:
  # Install required tools
  - apt-get update
  - apt-get install -y curl unzip bash git make ansible

  # Install Terraform if not already installed
  - |
    if [ ! -f /usr/local/bin/terraform ]; then
      curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/tf.zip
      unzip -o /tmp/tf.zip -d /usr/local/bin
      rm -f /tmp/tf.zip
    fi
  - terraform version

# ============================================================================
# VALIDATE STAGE: Format and validate all code
# ============================================================================

tf-fmt:
  stage: validate
  script:
    - make tf-fmt
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^feature\//

tf-validate:
  stage: validate
  script:
    - make tf-validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^feature\//

ansible-check:
  stage: validate
  script:
    - make ansible-check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^feature\//

# ============================================================================
# TEST STAGE: Run all tests and show summary
# ============================================================================

local-test:
  stage: test
  script:
    - make local-test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^feature\//
    - if: $CI_COMMIT_BRANCH == "main"
      when: always

pipeline-success:
  stage: test
  script:
    - echo "======================================"
    - echo "Pipeline Completed Successfully"
    - echo "======================================"
    - echo ""
    - echo "Terraform + Ansible Pipeline Summary:"
    - echo "Project: ec2-nginx-ansible"
    - echo "Branch: $CI_COMMIT_BRANCH"
    - echo ""
    - echo "Validations Passed:"
    - echo "- Terraform Format Check (make tf-fmt)"
    - echo "- Terraform Validate (make tf-validate)"
    - echo "- Ansible Syntax Check (make ansible-check)"
    - echo ""
    - echo "Next Steps:"
    - echo "Local: make demo-setup"
    - echo "Or: make tf-plan && make tf-apply && make ansible-run"
    - echo ""
    - echo "Cleanup: make demo-destroy"
    - echo "======================================"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - if: $CI_COMMIT_BRANCH =~ /^feature\//
      when: on_success
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

