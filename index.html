<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Team Alpha - Latest Web Server</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      color: white;
      padding: 40px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 10px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    }
    h1 {
      font-size: 48px;
      margin-bottom: 20px;
      font-weight: 700;
    }
    .subtitle {
      font-size: 24px;
      margin-bottom: 30px;
      opacity: 0.9;
    }
    .info {
      margin-top: 30px;
      font-size: 16px;
      opacity: 0.8;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 20px;
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 My Beautiful Team Alpha</h1>
    <div class="subtitle">Latest Web Server for Team Alpha</div>
    <div class="info">
      <p>✓ Nginx running on Amazon Linux 2023</p>
      <p>✓ Built with Packer & Deployed with Terraform</p>
      <p>✓ Automated Infrastructure as Code</p>
    </div>
    <div class="badge">Powered by AWS</div>
  </div>
</body>
</html>
