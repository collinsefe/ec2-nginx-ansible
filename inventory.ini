# Ansible Inventory Example for EC2 Instances

[ec2_instances]
# Replace these with your actual EC2 instance IPs or hostnames
ec2-instance-1 ansible_host=10.0.1.10 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/my-key.pem
ec2-instance-2 ansible_host=10.0.1.11 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/my-key.pem

# Or use a single instance for demo
# web-server ansible_host=192.168.1.100 ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/my-key.pem

# Group variables (applies to all hosts in the group)
[ec2_instances:vars]
ansible_connection=ssh
ansible_port=22
